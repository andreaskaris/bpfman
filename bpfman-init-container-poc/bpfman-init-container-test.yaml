apiVersion: v1
kind: Pod
metadata:
  name: bpfman-init-container-test
spec:
  initContainers:
  # bpfman-init runs as a sidecar container (restartPolicy: Always). That way, its lifecycle preStop can delete
  # the program. In addition, it has cleanup logic on startup, just in case something fails on preStop.
  - name: bpfman-init
    image: $IMAGE_NAME
    imagePullPolicy: Always
    securityContext:
     privileged: true
    # restartPolicy "Always" makes this a sidecar
    # https://kubernetes.io/docs/concepts/workloads/pods/sidecar-containers/
    restartPolicy: Always
    lifecycle:
      preStop:
        exec:
          command: 
          - "/bin/sh"
          - "-c"
          - |
            get_ids() {
              bpfman list programs --application XDPCounter | awk '/XDPCounter/ {print $1}'
            }
            for ID in $(get_ids); do
              bpfman unload $ID
            done
    command: ["/bin/bash", "-c"]
    args:
    - |
      set -eux
      get_ids() {
        bpfman list programs --application XDPCounter | awk '/XDPCounter/ {print $1}'
      }

      # Clean up first, just in case
      for ID in $(get_ids); do
        bpfman unload $ID
      done

      # Now, attach
      bpfman load file -p /usr/local/lib/ebpf/go-xdp-counter/bpf_x86_bpfel.o \
                       --programs xdp:xdp_stats \
                       --application XDPCounter
                       # Would be needed if bpfman CSI approach actually worked
                       # --metadata bpfman.io/ProgramName=xdp_stats
      ID=$(get_ids | tail)
      bpfman attach $ID xdp --iface eth0 --priority 100
      > /tmp/ready
      sleep infinity
    startupProbe:
      exec:
        command:
        - cat
        - /tmp/ready
    volumeMounts:
    - name: bpfman-volume
      mountPath: /run/bpfman
    - name: bpfman-lib-volume
      mountPath: /var/lib/bpfman
    - name: bpf-fs-volume
      mountPath: /sys/fs/bpf
  containers:
  - name: main-container
    image: $IMAGE_NAME
    command: ["/bin/bash", "-c"]
    args:
    - |
      set -eux
      /usr/local/lib/ebpf/go-xdp-counter/go-xdp-counter --crd
    volumeMounts:
    - name: xdp-stats-map
      mountPath: /run/xdp/maps/xdp_stats_map
  volumes:
  - name: bpfman-volume
    hostPath:
      path: /run/bpfman
      type: DirectoryOrCreate
  - name: bpfman-lib-volume
    hostPath:
      path: /var/lib/bpfman
      type: DirectoryOrCreate
  - name: bpf-fs-volume
    hostPath:
      path: /sys/fs/bpf
      type: Directory
  # Chicken egg problem. This fails with
  # "Bpfman Program xdp_stats not found" unless we preload a dummy map
  # manually with:
  # bpfman load file -p /usr/local/lib/ebpf/go-xdp-counter/bpf_x86_bpfel.o --programs xdp:xdp_stats --application XDPCounter --metadata bpfman.io/ProgramName=xdp_stats
  # due to bpfman-api/src/bin/rpc/storage.rs:170
  # - name: xdp-stats-map
  #   csi:
  #     driver: csi.bpfman.io
  #     volumeAttributes:
  #       csi.bpfman.io/program: xdp_stats
  #       csi.bpfman.io/maps: xdp_stats_map
  - name: xdp-stats-map
    hostPath:
      path: /sys/fs/bpf/xdp_stats_map
      type: File
  restartPolicy: Never
